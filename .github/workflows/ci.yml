name: AgroScope CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pull Model and Results with DVC
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          if [ -n "$GDRIVE_CREDENTIALS_DATA" ]; then
            dvc remote modify --local gdrive gdrive_use_service_account true
            dvc pull promote_model predict_cycle
          else
            echo "GDRIVE_CREDENTIALS_DATA isn't set, so tests that need these files will be skipped."
          fi

      - name: Run Backend Pytest Suite
        run: |
          pytest tests -v

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Production Frontend
        working-directory: frontend
        run: |
          npm run build
