# Satellite downloads are not a stage: src/ingestion/fetch_satellite.py takes a
# date range and fetches many GB, so data/raw/satellite is tracked with `dvc add`.
stages:
  acquire_weather:
    cmd: python src/ingestion/fetch_weather.py --geojson data/raw/study_area/command_area.geojson
    params:
      - configs/settings.yaml:
          - weather
    deps:
      - src/config.py
      - src/ingestion/fetch_weather.py
      - data/raw/study_area/command_area.geojson
    outs:
      - data/raw/weather/daily_weather.csv

  validate_raw:
    cmd: python src/validation/validate_data.py --stage raw
    params:
      - configs/settings.yaml:
          - validation
          - weather.start_date
          - weather.end_date
    deps:
      - src/config.py
      - src/validation/validate_data.py
      - data/raw/weather/daily_weather.csv
      - data/raw/satellite/scenes_manifest.csv
    outs:
      - reports/validation_raw.json:
          cache: false

  preprocess_satellite:
    cmd: python src/preprocessing/preprocess_bands.py
    params:
      - configs/settings.yaml:
          - aoi
          - satellite.valid_scl_classes
          - satellite.boa_add_offset
          - satellite.feature_version
    deps:
      - src/config.py
      - src/preprocessing/preprocess_bands.py
      - data/raw/study_area/command_area.geojson
      - data/raw/satellite
      - reports/validation_raw.json
    outs:
      - data/processed/spatial_grid_250m.geojson
      - data/processed/satellite_grid_features.csv

  generate_labels:
    cmd: python src/target/generate_labels.py
    params:
      - configs/settings.yaml:
          - labels
    deps:
      - src/config.py
      - src/target/generate_labels.py
      - data/raw/weather/daily_weather.csv
      - data/processed/satellite_grid_features.csv
    outs:
      - data/processed/target_labels.csv
      - data/features/features.csv

  validate_features:
    cmd: python src/validation/validate_data.py --stage features
    params:
      - configs/settings.yaml:
          - validation
          - training.features
          - training.target_column
          - training.temporal_split_date
    deps:
      - src/config.py
      - src/validation/validate_data.py
      - data/features/features.csv
    outs:
      - reports/validation_features.json:
          cache: false

  train_evaluate:
    cmd: python src/training/train.py
    params:
      - configs/settings.yaml:
          - training
    deps:
      - src/config.py
      - src/training/train.py
      - src/training/tracking.py
      - data/features/features.csv
      - reports/validation_features.json
    outs:
      - models/candidate/model.pkl
      - models/candidate/feature_metadata.json

  evaluate_model:
    cmd: python src/training/evaluate.py
    params:
      - configs/settings.yaml:
          - promotion
    deps:
      - src/config.py
      - src/training/evaluate.py
      - models/candidate/feature_metadata.json
    outs:
      - reports/evaluation_result.json:
          cache: false

  promote_model:
    cmd: python src/training/promote.py
    params:
      - configs/settings.yaml:
          - promotion
          - tracking
    deps:
      - src/config.py
      - src/training/promote.py
      - src/training/tracking.py
      - models/candidate/model.pkl
      - models/candidate/feature_metadata.json
      - reports/evaluation_result.json
    outs:
      - models/model.pkl
      - models/feature_metadata.json
      - reports/promotion_decision.json:
          cache: false

  predict_cycle:
    cmd: python src/inference/predict.py
    params:
      - configs/settings.yaml:
          - inference
          - aoi.cell_area_ha
          - labels.min_vegetated_ndvi
    deps:
      - src/config.py
      - src/inference/predict.py
      - src/inference/explainability.py
      - src/advisory/advisory_engine.py
      - models/model.pkl
      - models/feature_metadata.json
      - data/features/features.csv
      - data/processed/spatial_grid_250m.geojson
    outs:
      - data/processed/stress_map.geojson
      - data/processed/irrigation_map.geojson
      - data/processed/cycle_statistics.json

  monitor_drift:
    cmd: python src/monitoring/drift.py
    params:
      - configs/settings.yaml:
          - monitoring
          - training.features
          - training.temporal_split_date
    deps:
      - src/config.py
      - src/monitoring/drift.py
      - data/features/features.csv
      - data/processed/cycle_statistics.json
      - data/processed/cycle_statistics_by_date.json
      - data/processed/cycle_results.csv
    outs:
      - data/processed/drift_summary.json
      - data/processed/drift_report.html
